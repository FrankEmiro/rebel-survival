server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Nessun registro delle visite (IP, browser): solo errori gravi del server
    access_log off;
    error_log /dev/stderr crit;

    # File nascosti (.git, .claude, ...) mai serviti
    location ~ /\. {
        return 404;
    }

    # Service Worker — NESSUNA cache (deve sempre essere aggiornato)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # manifest.json — no cache
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Asset statici — cache lunga (CSS, JS, font, icone)
    location ~* \.(js|css|woff2|png|jpg|jpeg|webp|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Confini della mappa: tipo JSON, così nginx li comprime (17 MB → circa 5 MB in rete)
    location ~* \.geojson$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=604800";
    }

    # Tutto il resto → index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Header sicurezza
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
