plugins {
    id 'com.android.application'
}

// Numero di versione = numero della cache del service worker (sw.js, «kit-resilienza-vNN»).
// Lo passa tools/build-android.sh con -PrsVersion=NN.
def rsVersion = (project.findProperty('rsVersion') ?: '1').toString().toInteger()

android {
    // Identificativo dell'app: su Google Play NON si può più cambiare dopo la prima pubblicazione.
    namespace 'it.cyberrebellion.rebelsurvival'
    compileSdk 36

    defaultConfig {
        applicationId 'it.cyberrebellion.rebelsurvival'
        minSdk 24
        targetSdk 36
        versionCode rsVersion
        versionName "v${rsVersion}"
    }

    // Firma definitiva: file della chiave fuori dal repository (RS_KEYSTORE, predefinito
    // ~/RebelSurvival-firma/rebelsurvival.jks) e password solo da variabile d'ambiente
    // ANDROID_KEYSTORE_PASSWORD. Se mancano, si usa la chiave di prova del computer.
    def ksFile = file(System.getenv('RS_KEYSTORE') ?: (System.getProperty('user.home') + '/RebelSurvival-firma/rebelsurvival.jks'))
    def ksPass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def hasReleaseKey = ksFile.exists() && ksPass
    signingConfigs {
        if (hasReleaseKey) {
            rsRelease {
                storeFile ksFile
                storePassword ksPass
                keyAlias 'rebelsurvival'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.rsRelease : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // I file dell'app web sono già compressi o piccoli: non ricomprimere PNG e PDF
    androidResources {
        noCompress += ['png', 'webp', 'pdf']
    }
}
