<text x='184.0' y='285.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>Chiediti se potresti cavartela</text>
<text x='184.0' y='305.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>da solo per alcuni giorni</text>
<text x='184.0' y='325.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>senza farmacia né ospedale</text>
<g transform='translate(458.5,128.0) scale(0.892)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><rect x='38' y='12' width='44' height='96' rx='8'/><path d='M54 22 h12'/><circle cx='60' cy='96' r='4'/></g></g>
