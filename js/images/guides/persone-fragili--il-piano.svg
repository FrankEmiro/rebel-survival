<text x='512.0' y='265.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>Crea una rete di persone che</text>
<text x='512.0' y='285.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>possano aiutarti; tieni i loro</text>
<text x='512.0' y='305.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>numeri su carta e sul telefono</text>
<text x='512.0' y='325.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>e di&#x27; loro dove sono le scorte</text>
<g transform='translate(776.5,128.0) scale(1.058)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M16 30 l28 -10 l32 10 l28 -10 v70 l-28 10 l-32 -10 l-28 10z'/><path d='M44 20 v70 M76 30 v70'/><circle cx='62' cy='54' r='6' fill='#b0362a' stroke='none'/></g></g>
