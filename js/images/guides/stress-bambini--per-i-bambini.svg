<text x='512.0' y='58' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='36' font-weight='800' fill='#2a2a26'>PER I BAMBINI</text>
<text x='512.0' y='92' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='19' fill='#a8781f'>Paura e stress: adulti e bambini (Ready.gov)</text>
<g transform='translate(126.5,128.0) scale(0.958)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><circle cx='38' cy='34' r='12'/><path d='M38 46 v34 M38 56 l-14 12 M38 56 l14 12 M38 80 l-10 26 M38 80 l10 26'/><circle cx='82' cy='50' r='9'/><path d='M82 59 v26 M82 66 l-10 8 M82 66 l10 8 M82 85 l-8 20 M82 85 l8 20'/></g></g>
<circle cx='44.0' cy='142.0' r='14' fill='#a8781f'/><text x='44.0' y='148.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='17' font-weight='800' fill='#fff'>1</text>
<text x='184.0' y='273.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>I genitori sono quasi sempre</text>
<text x='184.0' y='293.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>il sostegno migliore: stai</text>
<text x='184.0' y='313.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>vicino, abbraccia, rassicura</text>
<g transform='translate(464.5,128.0) scale(0.792)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><circle cx='60' cy='60' r='42' fill='#d9cfb8'/><text x='60' y='76' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='46' font-weight='800' fill='#2a2a26' stroke='none'>2</text></g></g>
<circle cx='372.0' cy='142.0' r='14' fill='#a8781f'/><text x='372.0' y='148.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='17' font-weight='800' fill='#fff'>2</text>
<text x='512.0' y='253.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>Ascolta le loro paure e</text>
<text x='512.0' y='273.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>rispondi con parole semplici e</text>
<text x='512.0' y='293.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>vere. I più piccoli possono</text>
<text x='512.0' y='313.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>disegnare o raccontare</text>
<g transform='translate(792.5,128.0) scale(0.792)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><circle cx='60' cy='60' r='42' fill='#d9cfb8'/><text x='60' y='76' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='46' font-weight='800' fill='#2a2a26' stroke='none'>3</text></g></g>
<circle cx='700.0' cy='142.0' r='14' fill='#a8781f'/><text x='700.0' y='148.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='17' font-weight='800' fill='#fff'>3</text>
<text x='840.0' y='253.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>Le paure più comuni: che</text>
<text x='840.0' y='273.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>succeda di nuovo, che qualcuno</text>
<text x='840.0' y='293.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>si faccia male, di restare</text>
<text x='840.0' y='313.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>soli</text>
<g transform='translate(136.5,337.0) scale(0.792)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><circle cx='60' cy='60' r='42' fill='#d9cfb8'/><text x='60' y='76' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='46' font-weight='800' fill='#2a2a26' stroke='none'>4</text></g></g>
<circle cx='44.0' cy='351.0' r='14' fill='#a8781f'/><text x='44.0' y='357.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='17' font-weight='800' fill='#fff'>4</text>
<text x='184.0' y='462.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>Ripristina appena puoi gli</text>
<text x='184.0' y='482.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>orari di pasti, gioco, sonno e</text>
<text x='184.0' y='502.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>scuola. Dai piccoli compiti</text>
<text x='184.0' y='522.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>utili e lodali</text>
<g transform='translate(464.5,337.0) scale(0.792)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><rect x='16' y='42' width='88' height='56' rx='8'/><path d='M30 42 l50 -26'/><circle cx='44' cy='70' r='14'/><path d='M70 60 h22 M70 72 h22 M70 84 h14'/></g></g>
<circle cx='372.0' cy='351.0' r='14' fill='#a8781f'/><text x='372.0' y='357.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='17' font-weight='800' fill='#fff'>5</text>
<text x='512.0' y='462.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>Guarda le notizie insieme e</text>
<text x='512.0' y='482.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>spiega: le immagini ripetute</text>
<text x='512.0' y='502.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>fanno credere che stia</text>
<text x='512.0' y='522.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>succedendo di nuovo</text>
<g transform='translate(802.5,337.0) scale(0.625)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><rect x='28' y='54' width='64' height='50' rx='8'/><path d='M40 54 v-14 q0 -20 20 -20 q20 0 20 20 v14'/><circle cx='60' cy='78' r='6' fill='#a8781f'/></g></g>
<circle cx='700.0' cy='351.0' r='14' fill='#a8781f'/><text x='700.0' y='357.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='17' font-weight='800' fill='#fff'>6</text>
<text x='840.0' y='442.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>Reazioni possibili: i piccoli</text>
<text x='840.0' y='462.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>possono tornare a bagnare il</text>
<text x='840.0' y='482.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>letto o non volersi staccare;</text>
<text x='840.0' y='502.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>i grandi possono essere</text>
<text x='840.0' y='522.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>arrabbiati o chiudersi</text>
<text x='512.0' y='552' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='17' font-weight='700' fill='#a8781f'>Altri passi nel testo qui sotto</text>
