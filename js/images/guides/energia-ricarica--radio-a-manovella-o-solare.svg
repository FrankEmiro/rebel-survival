<text x='512.0' y='462.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>della radio.</text>
<g transform='translate(750.0,212.0) scale(1.500)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><rect x='16' y='42' width='88' height='56' rx='8'/><path d='M30 42 l50 -26'/><circle cx='44' cy='70' r='14'/><path d='M70 60 h22 M70 72 h22 M70 84 h14'/></g></g>
