<text x='184.0' y='402.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>In emergenza anche l&#x27;acqua che</text>
<text x='184.0' y='422.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>sembra limpida può contenere</text>
<text x='184.0' y='442.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>batteri, virus e parassiti</text>
<text x='184.0' y='462.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>(per esempio Giardia e</text>
<text x='184.0' y='482.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>Cryptosporidium).</text>
<g transform='translate(422.0,212.0) scale(1.500)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M60 14 q-36 46 -36 66 a36 36 0 0 0 72 0 q0 -20 -36 -66z' fill='#5a8fb0'/><path d='M44 82 q0 12 12 16' stroke='#fff'/></g></g>
<circle cx='372.0' cy='226.0' r='14' fill='#a8781f'/><text x='372.0' y='232.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='17' font-weight='800' fill='#fff'>2</text>
<text x='512.0' y='422.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='700' fill='#2a2a26'>L&#x27;aspetto non basta: tratta</text>
<text x='512.0' y='442.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>sempre l&#x27;acqua di cui non sei</text>
<text x='512.0' y='462.0' text-anchor='middle' font-family='Helvetica Neue, Helvetica, Arial, sans-serif' font-size='16' font-weight='500' fill='#2a2a26'>sicuro.</text>
<g transform='translate(750.0,202.0) scale(1.500)'><g fill='none' stroke='#2a2a26' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'><path d='M22 52 h76 v34 q0 12 -12 12 h-52 q-12 0 -12 -12z'/><path d='M14 52 h92'/><path d='M98 60 h14'/><path d='M42 42 q-6 -10 0 -18 q6 -8 0 -16'/><path d='M60 42 q-6 -10 0 -18 q6 -8 0 -16'/><path d='M78 42 q-6 -10 0 -18 q6 -8 0 -16'/><path d='M44 116 q-6 -10 4 -16 q-2 8 6 8 q2 -10 10 -12 q-4 10 6 14 q6 -6 2 -12 q12 8 4 18z' stroke='#b0362a'/></g></g>
